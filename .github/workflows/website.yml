name: Website

# Builds apps/website (Vite + React + Tailwind) and publishes it to GitHub
# Pages at https://rafay99-epic.github.io/sqlpilot/. Pull requests only build,
# so a broken page can't merge; main deploys.
on:
  push:
    branches: [main]
    paths: ["apps/website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["apps/website/**", ".github/workflows/website.yml"]

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/website

jobs:
  build:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: apps/website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
